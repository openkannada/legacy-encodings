name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: .github/scripts/dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.17"
      - run: uvx reuse@6.3.0 lint

  tables:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.17"
      - run: uv run --no-project --python 3.12 python tools/tables.py check
      - run: uv run --no-project --python 3.12 --with jsonschema==4.25.1 --with pdfminer.six==20260107 --with fonttools==4.68.0 python -m unittest discover -s tests -v

  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.17"
      - run: cargo build --release --locked --manifest-path adapters/kannadi/Cargo.toml
      - run: uv run --no-project --python 3.12 python conformance/run.py --markdown --out ref.json -- python reference/adapter.py
      - run: uv run --no-project --python 3.12 python conformance/run.py --markdown --out kannadi.json -- adapters/kannadi/target/release/kle-kannadi-adapter
      - run: uv run --no-project --python 3.12 python conformance/run.py --compare ref.json kannadi.json
      - run: uv run --no-project --python 3.12 python conformance/differential.py --count 1000 --seed 1 -- python reference/adapter.py -- adapters/kannadi/target/release/kle-kannadi-adapter
      # A --cases run is not assessed for conformance, so run.py exits 1; score.py fails if a line has no response.
      - run: |
          uv run --no-project --python 3.12 python conformance/run.py --cases benchmark/lines --no-detect --no-fonts --out bench.json -- adapters/kannadi/target/release/kle-kannadi-adapter > /dev/null || true
          uv run --no-project --python 3.12 python benchmark/tools/score.py benchmark/lines bench.json
